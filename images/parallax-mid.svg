<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" preserveAspectRatio="xMinYMin slice">
  <!-- Tileable city skyline silhouette. Left and right edges designed to match for horizontal tiling. -->
  <rect width="100%" height="100%" fill="transparent" />
  <g fill="#2b2650" opacity="0.95">
    <!-- make a repeating rhythm of blocks; ensure first and last columns align -->
    <rect x="0" y="60" width="80" height="120" />
    <rect x="80" y="40" width="60" height="140" />
    <rect x="140" y="80" width="90" height="100" />
    <rect x="230" y="30" width="70" height="150" />
    <rect x="300" y="20" width="120" height="160" />
    <rect x="420" y="70" width="60" height="110" />
    <rect x="480" y="50" width="90" height="130" />
    <rect x="570" y="10" width="110" height="170" />
    <rect x="680" y="85" width="80" height="95" />
    <rect x="760" y="45" width="60" height="135" />
    <rect x="820" y="25" width="90" height="155" />
    <rect x="910" y="60" width="90" height="120" />
    <!-- repeat end that aligns with leftmost block (0..80) -->
  </g>
  <!-- a few lit windows for depth -->
  <g fill="#9ee7ff" opacity="0.18">
    <rect x="315" y="45" width="6" height="10" />
    <rect x="335" y="45" width="6" height="10" />
    <rect x="510" y="60" width="6" height="10" />
    <rect x="534" y="60" width="6" height="10" />
    <rect x="760" y="70" width="6" height="10" />
  </g>
  <!-- neon signs for cyberpunk feel (tile-safe) -->
  <g opacity="0.95">
    <rect x="160" y="20" width="36" height="8" fill="#ff6bd6" rx="1" />
    <rect x="210" y="32" width="24" height="6" fill="#22d3ee" rx="1" />
    <rect x="450" y="18" width="48" height="10" fill="#fbbf24" rx="1" />
    <rect x="740" y="28" width="32" height="8" fill="#7c3aed" rx="1" />
  </g>
</svg>