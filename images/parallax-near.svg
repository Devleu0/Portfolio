<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" preserveAspectRatio="xMinYMin slice">
  <!-- Tileable near ground: neon grid lines and repeating small street posts -->
  <rect width="100%" height="100%" fill="transparent" />
  <!-- neon grid: horizontal lines -->
  <g stroke="#0ee6ff" stroke-width="2" opacity="0.16">
    <line x1="0" y1="70" x2="1000" y2="70" />
    <line x1="0" y1="82" x2="1000" y2="82" />
    <line x1="0" y1="94" x2="1000" y2="94" />
  </g>
  <!-- vertical grid tick marks to give perspective (tileable) -->
  <g stroke="#0ee6ff" stroke-width="1" opacity="0.12">
    <line x1="24" y1="70" x2="24" y2="100" />
    <line x1="72" y1="70" x2="72" y2="100" />
    <line x1="120" y1="70" x2="120" y2="100" />
    <line x1="168" y1="70" x2="168" y2="100" />
    <line x1="216" y1="70" x2="216" y2="100" />
    <line x1="264" y1="70" x2="264" y2="100" />
    <line x1="312" y1="70" x2="312" y2="100" />
    <line x1="360" y1="70" x2="360" y2="100" />
    <line x1="408" y1="70" x2="408" y2="100" />
    <line x1="456" y1="70" x2="456" y2="100" />
    <line x1="504" y1="70" x2="504" y2="100" />
    <line x1="552" y1="70" x2="552" y2="100" />
    <line x1="600" y1="70" x2="600" y2="100" />
    <line x1="648" y1="70" x2="648" y2="100" />
    <line x1="696" y1="70" x2="696" y2="100" />
    <line x1="744" y1="70" x2="744" y2="100" />
    <line x1="792" y1="70" x2="792" y2="100" />
    <line x1="840" y1="70" x2="840" y2="100" />
    <line x1="888" y1="70" x2="888" y2="100" />
    <line x1="936" y1="70" x2="936" y2="100" />
    <line x1="984" y1="70" x2="984" y2="100" />
  </g>
  <!-- repeating street post silhouette (subtle) -->
  <g fill="#0b1220" opacity="0.9">
    <rect x="40" y="20" width="8" height="50" />
    <rect x="200" y="20" width="8" height="50" />
    <rect x="360" y="20" width="8" height="50" />
    <rect x="520" y="20" width="8" height="50" />
    <rect x="680" y="20" width="8" height="50" />
    <rect x="840" y="20" width="8" height="50" />
  </g>
</svg>