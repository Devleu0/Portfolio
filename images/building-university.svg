<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380">
  <rect width="100%" height="100%" fill="transparent" />
  <!-- base silhouette -->
  <g shape-rendering="crispEdges" fill="#1F2937">
    <rect x="40" y="120" width="440" height="240" rx="6" />
  </g>
  <!-- stepped towers -->
  <g shape-rendering="crispEdges" fill="#111827">
    <rect x="60" y="60" width="120" height="300" />
    <rect x="200" y="20" width="160" height="340" />
    <rect x="380" y="80" width="80" height="280" />
  </g>
  <!-- windows grid -->
  <g fill="#FDE68A" opacity="0.95">
    <!-- left tower windows -->
    <g>
      <!-- 5 cols x 10 rows approx -->
      <!-- use small rects to simulate lit windows -->
      <rect x="72" y="76" width="14" height="12" rx="2" />
      <rect x="92" y="76" width="14" height="12" rx="2" />
      <rect x="112" y="76" width="14" height="12" rx="2" />
      <rect x="132" y="76" width="14" height="12" rx="2" />
      <!-- a few rows down -->
      <rect x="72" y="100" width="14" height="12" rx="2" />
      <rect x="92" y="100" width="14" height="12" rx="2" />
      <rect x="112" y="100" width="14" height="12" rx="2" />
      <rect x="132" y="100" width="14" height="12" rx="2" />
    </g>
    <!-- center tower windows -->
    <g>
      <rect x="220" y="36" width="18" height="14" rx="2" />
      <rect x="248" y="36" width="18" height="14" rx="2" />
      <rect x="276" y="36" width="18" height="14" rx="2" />
      <rect x="220" y="64" width="18" height="14" rx="2" />
      <rect x="248" y="64" width="18" height="14" rx="2" />
      <rect x="276" y="64" width="18" height="14" rx="2" />
      <rect x="220" y="92" width="18" height="14" rx="2" />
      <rect x="248" y="92" width="18" height="14" rx="2" />
      <rect x="276" y="92" width="18" height="14" rx="2" />
    </g>
    <!-- right tower windows -->
    <g>
      <rect x="392" y="86" width="12" height="10" rx="2" />
      <rect x="412" y="86" width="12" height="10" rx="2" />
      <rect x="392" y="104" width="12" height="10" rx="2" />
      <rect x="412" y="104" width="12" height="10" rx="2" />
    </g>
  </g>
  <!-- entrance accent -->
  <g fill="#EAB308">
    <rect x="220" y="280" width="80" height="60" rx="4" />
  </g>
</svg>