<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" preserveAspectRatio="xMinYMin slice">
  <!-- Tileable starfield / subtle cloud band. Designed to repeat horizontally -->
  <rect width="100%" height="100%" fill="transparent" />
  <!-- small stars pattern -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="40" cy="40" r="1.7" />
    <circle cx="110" cy="80" r="1.2" />
    <circle cx="190" cy="30" r="1.5" />
    <circle cx="250" cy="120" r="1.1" />
    <circle cx="320" cy="60" r="1.3" />
    <circle cx="410" cy="90" r="1.6" />
    <circle cx="500" cy="40" r="1.2" />
    <circle cx="610" cy="110" r="1.4" />
    <circle cx="700" cy="20" r="1.2" />
    <circle cx="780" cy="70" r="1.5" />
    <circle cx="860" cy="50" r="1.1" />
    <circle cx="940" cy="95" r="1.3" />
  </g>
  <!-- faint cloud band that tiles smoothly: two soft rectangles with gradients -->
  <defs>
    <linearGradient id="cloudG" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <g opacity="0.28">
    <rect x="0" y="40" width="500" height="36" fill="url(#cloudG)"/>
    <rect x="500" y="40" width="500" height="36" fill="url(#cloudG)"/>
    <rect x="200" y="16" width="360" height="20" fill="url(#cloudG)"/>
  </g>
  <!-- subtle noise to make field feel less uniform -->
  <g fill="#ffffff" opacity="0.06">
    <rect x="60" y="200" width="2" height="2" />
    <rect x="220" y="210" width="2" height="2" />
    <rect x="410" y="195" width="2" height="2" />
    <rect x="640" y="220" width="2" height="2" />
    <rect x="880" y="205" width="2" height="2" />
  </g>
</svg>