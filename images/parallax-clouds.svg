<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" preserveAspectRatio="xMinYMin slice">
  <rect width="100%" height="100%" fill="transparent" />
  <defs>
    <linearGradient id="cg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <g fill="url(#cg)">
    <!-- denser cloud band: multiple overlapping ellipses to increase visual density -->
    <ellipse cx="40" cy="42" rx="160" ry="34" />
    <ellipse cx="180" cy="32" rx="120" ry="26" />
    <ellipse cx="300" cy="46" rx="180" ry="36" />
    <ellipse cx="460" cy="34" rx="140" ry="28" />
    <ellipse cx="620" cy="48" rx="200" ry="40" />
    <ellipse cx="820" cy="38" rx="150" ry="30" />
    <ellipse cx="980" cy="28" rx="120" ry="22" />
    <ellipse cx="1120" cy="42" rx="160" ry="34" />
    <ellipse cx="1280" cy="36" rx="140" ry="28" />
    <ellipse cx="1440" cy="46" rx="180" ry="36" />
    <ellipse cx="1600" cy="34" rx="140" ry="28" />
    <ellipse cx="1760" cy="26" rx="120" ry="22" />
    <!-- a few smaller front puffs for texture -->
    <ellipse cx="220" cy="56" rx="54" ry="12" opacity="0.9" />
    <ellipse cx="700" cy="58" rx="68" ry="14" opacity="0.85" />
    <ellipse cx="1300" cy="52" rx="52" ry="10" opacity="0.9" />
  </g>
</svg>